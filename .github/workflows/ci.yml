name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pull requests run the full suite on Node 24 only, and narrow typecheck and unit tests to changed
# packages. Pushes to main and manual runs keep every runtime, the floors, and the full suite.
jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ${{ fromJSON(github.event_name == 'pull_request' && '[24]' || '[22, 24]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation suite
        run: pnpm run check
        env:
          HARNESS_AFFECTED_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

      - name: Audit all dependency classes
        run: pnpm security:check

      - name: Test packed consumers
        run: pnpm test:package

      - name: Test minimum supported registry tools
        run: pnpm test:compatibility baseline

      - name: Test current supported registry tools
        run: pnpm test:compatibility current

  runtime-floors:
    name: Runtime floor (${{ matrix.os }}, Node ${{ matrix.node }})
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.19.0, 24.11.0]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Test minimum supported registry tools
        run: pnpm test:compatibility baseline

      - name: Test current supported registry tools
        run: pnpm test:compatibility current

  result:
    name: Validate
    if: always()
    needs: [validate, runtime-floors]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Runtime floors may only be skipped by their own pull-request condition.
      - name: Require every validation matrix leg
        env:
          RESULT: ${{ needs.validate.result }}
          FLOORS: ${{ needs.runtime-floors.result }}
          EVENT: ${{ github.event_name }}
        run: test "$RESULT" = success && { test "$FLOORS" = success || { test "$EVENT" = pull_request && test "$FLOORS" = skipped; }; }
