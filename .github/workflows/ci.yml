name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation suite
        run: pnpm run check

      - name: Audit all dependency classes
        run: pnpm security:check

      - name: Test packed consumers
        run: pnpm test:package

      - name: Test minimum supported registry tools
        run: pnpm test:compatibility baseline

      - name: Test current supported registry tools
        run: pnpm test:compatibility current

  runtime-floors:
    name: Runtime floor (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.19.0, 24.11.0]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Test minimum supported registry tools
        run: pnpm test:compatibility baseline

      - name: Test current supported registry tools
        run: pnpm test:compatibility current

  result:
    name: Validate
    if: always()
    needs: [validate, runtime-floors]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation matrix leg
        env:
          RESULT: ${{ needs.validate.result }}
          FLOORS: ${{ needs.runtime-floors.result }}
        run: test "$RESULT" = success && test "$FLOORS" = success
