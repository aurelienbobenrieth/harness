name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: harness-version-pr
  cancel-in-progress: false

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    # A boolean, never the secrets themselves: steps cannot test secrets directly.
    env:
      RELEASE_APP_CONFIGURED: ${{ secrets.RELEASE_APP_CLIENT_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release policy
        run: pnpm release:check

      # Events authored with GITHUB_TOKEN start no workflows, so a version PR opened with it waits for
      # manual CI. The release App's token lets it run CI on its own; without the App, fall back.
      - name: Create release App token
        id: app-token
        if: env.RELEASE_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update version PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bash scripts/version.sh
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          github-token: ${{ steps.app-token.outputs.token || github.token }}
