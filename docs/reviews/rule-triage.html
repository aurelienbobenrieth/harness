<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harness — tri des règles</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f5;
        --surface: #fff;
        --text: #20211f;
        --muted: #686b66;
        --border: #d8dad5;
        --accent: #285f4f;
        --soft: #e8f0ed;
        --warn: #8b5e14;
        --warn-soft: #f6ecd7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171916;
          --surface: #20231f;
          --text: #eef0eb;
          --muted: #aeb3aa;
          --border: #3a3e38;
          --accent: #8cc8b5;
          --soft: #273b34;
          --warn: #efc16d;
          --warn-soft: #3c3120;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 system-ui,
          sans-serif;
      }
      main {
        max-width: 1440px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        font-weight: 600;
      }
      h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      p {
        margin: 0;
      }
      .muted {
        color: var(--muted);
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 10px;
        margin: 18px 0;
      }
      .stat {
        padding: 12px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .stat strong {
        display: block;
        margin-top: 2px;
        font-size: 20px;
        font-weight: 600;
      }
      .controls {
        display: grid;
        grid-template-columns: minmax(220px, 2fr) repeat(3, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 10px;
      }
      label {
        display: grid;
        gap: 4px;
        color: var(--muted);
        font-size: 12px;
      }
      input,
      select,
      button {
        min-height: 38px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        padding: 7px 9px;
      }
      button,
      .file-button {
        cursor: pointer;
      }
      button:hover,
      .file-button:hover {
        border-color: var(--accent);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0 18px;
      }
      .actions button,
      .file-button {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 7px 11px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }
      .actions .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg);
      }
      .file-button input {
        display: none;
      }
      .package {
        margin: 14px 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 9px;
        overflow: hidden;
      }
      .package summary {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 13px 15px;
        cursor: pointer;
      }
      .package summary::marker {
        color: var(--muted);
      }
      .count {
        margin-left: auto;
        color: var(--muted);
        white-space: nowrap;
      }
      .package-description {
        padding: 0 15px 12px;
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        text-align: left;
      }
      th,
      td {
        padding: 10px 12px;
        border-top: 1px solid var(--border);
        vertical-align: top;
      }
      th:nth-child(1) {
        width: 25%;
      }
      th:nth-child(2) {
        width: 16%;
      }
      th:nth-child(3) {
        width: 39%;
      }
      th:nth-child(4) {
        width: 20%;
      }
      code {
        font-size: 12px;
      }
      a {
        color: var(--text);
        text-decoration-color: var(--border);
      }
      .description {
        margin-top: 4px;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        margin-right: 5px;
        padding: 2px 6px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--text);
        font-size: 11px;
      }
      .badge.review {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .decision {
        width: 100%;
      }
      .empty {
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }
      .hidden {
        display: none;
      }
      @media (max-width: 820px) {
        main {
          padding: 14px;
        }
        .summary {
          grid-template-columns: repeat(2, 1fr);
        }
        .controls {
          grid-template-columns: 1fr 1fr;
        }
        .table-wrap {
          overflow-x: auto;
        }
        table {
          min-width: 850px;
        }
      }
      @media (max-width: 480px) {
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tri des règles Harness</h1>
      <p class="muted">
        La recommandation est un avis, pas une décision. Chaque règle reste « non revue » jusqu’à ton choix.
      </p>
      <div class="summary" aria-live="polite">
        <div class="stat">
          <span class="muted">Périmètre</span><strong>176</strong><span class="muted">161 règles · 15 checks</span>
        </div>
        <div class="stat">
          <span class="muted">Décidées</span><strong id="reviewed-count">0</strong
          ><span class="muted" id="reviewed-share">0 %</span>
        </div>
        <div class="stat">
          <span class="muted">À revoir selon l’auto-review</span><strong id="attention-count">0</strong
          ><span class="muted">avant promotion</span>
        </div>
        <div class="stat">
          <span class="muted">Affichées</span><strong id="visible-count">176</strong
          ><span class="muted">selon les filtres</span>
        </div>
      </div>
      <div class="controls">
        <label>Recherche<input id="search" type="search" placeholder="Identifiant ou description" /></label>
        <label
          >Package<select id="package-filter">
            <option value="">Tous</option>
          </select></label
        >
        <label
          >Auto-review<select id="recommendation-filter">
            <option value="">Toutes</option>
            <option value="keep">Garder</option>
            <option value="review">À revoir</option>
          </select></label
        >
        <label
          >Décision<select id="decision-filter">
            <option value="">Toutes</option>
            <option value="unreviewed">Non revue</option>
            <option value="keep">Garder</option>
            <option value="modify">Modifier</option>
            <option value="remove">Retirer</option>
          </select></label
        >
      </div>
      <div class="actions">
        <button class="primary" id="export" type="button">Exporter les décisions</button>
        <button id="apply-recommendations" type="button">Appliquer l’avis aux lignes affichées</button>
        <label class="file-button"
          >Importer un JSON<input id="import" type="file" accept="application/json,.json"
        /></label>
        <button id="clear" type="button">Effacer les décisions</button>
      </div>
      <div id="packages"></div>
      <p id="empty" class="empty hidden">Aucune règle ne correspond aux filtres.</p>
    </main>

        const select = event.target.closest("select[data-key]");
        if (!select) return;
        if (select.value === "unreviewed") delete decisions[select.dataset.key];
        else decisions[select.dataset.key] = select.value;
        save();
        if (document.getElementById("decision-filter").value) render();
        else updateDecisionSummary();
      });
      document.getElementById("apply-recommendations").addEventListener("click", () => {
        const visibleSelects = [...document.querySelectorAll("select[data-key]")];
        if (
          visibleSelects.length === 0 ||
          !confirm(
            "Appliquer l’auto-review aux " +
              visibleSelects.length +
              " lignes affichées ? Les avis « à revoir » deviendront « modifier ».",
          )
        )
          return;
        for (const select of visibleSelects) {
          const value = unitsByKey.get(select.dataset.key).recommendation.verdict === "keep" ? "keep" : "modify";
          decisions[select.dataset.key] = value;
          select.value = value;
        }
        save();
        if (document.getElementById("decision-filter").value) render();
        else updateDecisionSummary();
      });
      document.getElementById("export").addEventListener("click", () => {
        const payload = {
          schemaVersion: 1,
          total: allUnits.length,
          decisions: Object.fromEntries(
            allUnits.map((unit) => {
              const key = unitKey(unit.package, unit.id);
              return [key, decisions[key] || "unreviewed"];
            }),
          ),
        };
        const link = document.createElement("a");
        link.href = URL.createObjectURL(
          new Blob([JSON.stringify(payload, null, 2) + "\n"], { type: "application/json" }),
        );
        link.download = "harness-rule-decisions.json";
        link.click();
        URL.revokeObjectURL(link.href);
      });
      document.getElementById("import").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const payload = JSON.parse(await file.text());
        if (payload.schemaVersion !== 1 || typeof payload.decisions !== "object")
          throw new Error("Fichier de décisions incompatible.");
        const validKeys = new Set(allUnits.map((unit) => unitKey(unit.package, unit.id)));
        for (const [key, value] of Object.entries(payload.decisions))
          if (validKeys.has(key) && ["keep", "modify", "remove"].includes(value)) decisions[key] = value;
        save();
        render();
        event.target.value = "";
      });
      document.getElementById("clear").addEventListener("click", () => {
        if (!confirm("Effacer toutes les décisions enregistrées dans ce navigateur ?")) return;
        for (const key of Object.keys(decisions)) delete decisions[key];
        save();
        render();
      });
      render();
    </script>
  </body>
</html>
